      merged.bookPreviewPage = Math.min(Math.max(Number(saved.bookPreviewPage) || 1, 1), 6);
      merged.imageChecks = {
        image1: { ...base.imageChecks.image1, ...((saved.imageChecks || {}).image1 || {}) },
        image2: { ...base.imageChecks.image2, ...((saved.imageChecks || {}).image2 || {}) },
        image3: { ...base.imageChecks.image3, ...((saved.imageChecks || {}).image3 || {}) }
      };
      merged.bookChecklist = { ...base.bookChecklist, ...(saved.bookChecklist || {}) };
      merged.creatorRules = { ...base.creatorRules, ...(saved.creatorRules || {}) };
      merged.bookSubmission = { ...base.bookSubmission, ...(saved.bookSubmission || {}) };
      merged.peerReview = { ...base.peerReview, ...(saved.peerReview || {}) };
      merged.selfChecklist = { ...base.selfChecklist, ...(saved.selfChecklist || {}) };
      merged.challenges = { ...base.challenges, ...(saved.challenges || {}) };
      merged.currentStep = Math.min(Math.max(Number(merged.currentStep) || 1, 1), steps.length);
      if (!saved.pages && merged.currentStep > 5) merged.currentStep = 6;
      return merged;
    }

    function loadState() {
      try {
        return mergeState(JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'), defaultState());
      } catch (error) {
        return defaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        navHint.textContent = '저장 공간을 사용할 수 없어요. 지금 화면에서 계속 진행해 주세요.';
      }
    }

    function getValue(path) {
      return path.split('.').reduce((obj, part) => obj && obj[part], state);
    }

    function setValue(path, value) {
      const parts = path.split('.');
      let obj = state;
      while (parts.length > 1) {
        obj = obj[parts.shift()];
      }
      obj[parts[0]] = value;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function safeText(value, fallback = '선택한 내용') {
      return escapeHtml(value || fallback);
    }

    function render() {
      captureFirstDraftIfNeeded();
      state.revisedStory = makeStory();
      syncStoryboardData();

      const current = state.currentStep;
      headerSubtitle.textContent = steps[current - 1];
      progressText.textContent = `${current} / ${steps.length}`;
      progressBar.style.width = `${(current / steps.length) * 100}%`;
      renderStepCircles();

      mainContent.classList.remove('step-transition');
      void mainContent.offsetWidth;
      mainContent.classList.add('step-transition');
      mainContent.innerHTML = [
        renderIntro,
        renderDreamStep,
        renderFutureStep,
        renderStoryStep,
        renderRevisionStep,
        renderStoryboardStep,
        renderSelectedImageStep,
        renderTransferStep,
        renderFinalStep
      ][current - 1]();

      updateNav();
      saveState();
      if (current === 9) scheduleRosterLoad();
    }

    function renderStepCircles() {
      stepCircles.innerHTML = steps.map((label, index) => {
        const number = index + 1;
        const isCurrent = number === state.currentStep;
        const isPast = number < state.currentStep;
        const classes = isCurrent
          ? 'bg-brand-100 text-brand-600 border-brand-200'
          : isPast
            ? 'bg-brand-500 text-white border-brand-500'
            : 'bg-white text-slate-400 border-slate-200';
        return `<button type="button" class="focus-ring shrink-0 w-8 h-8 rounded-full border flex items-center justify-center font-bold text-sm transition-all ${classes}" title="${escapeHtml(label)}" aria-label="${number}단계 ${escapeHtml(label)}" onclick="jumpToStep(${number})">${number}</button>`;
      }).join('');
    }

    function stepHead(number, title, desc, icon) {
      return `
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center gap-2 mb-3">
            <div class="w-10 h-10 bg-brand-100 rounded-full flex items-center justify-center text-xl text-brand-600" aria-hidden="true">${icon}</div>
            <span class="text-brand-600 font-bold text-sm tracking-wide">${number}단계</span>
          </div>
          <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-900 mb-3 break-keep">${title}</h2>
          <p class="text-slate-500 text-lg leading-relaxed break-keep">${desc}</p>
        </div>
      `;
    }

    function cardButton(label, onClick, selected = false, extra = '') {
      const selectedClasses = selected
        ? 'border-brand-500 bg-brand-50 text-slate-900 shadow-sm'

      return `
        <button type="button" aria-pressed="${selected ? 'true' : 'false'}" onclick="${onClick}" class="focus-ring relative min-h-[76px] text-left p-5 rounded-2xl border-2 transition-all ${selectedClasses} ${extra}">
          <span class="block pr-9 text-lg font-bold leading-snug break-keep">${escapeHtml(label)}</span>
          <span class="absolute right-5 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full border-2 flex items-center justify-center ${selected ? 'border-brand-500 bg-brand-500 text-white' : 'border-slate-300 text-transparent'}" aria-hidden="true">✓</span>
        </button>
      `;
    }

          <p class="text-slate-500 mt-1 break-keep">${desc}</p>
        </div>

    function reviewFocusBox(label, text, options = {}) {
      const idAttr = options.id ? ` id="${options.id}"` : '';

      return `
        <div class="review-focus ${extra}">
          <span class="review-focus-label">${escapeHtml(label)}</span>

        </div>
      `;

    function storyboardEditKey(pageKey, field) {
      return `${pageKey}:${field}`;
    }

    function isStoryboardEditing(pageKey, field) {
      return activeStoryboardEdit === storyboardEditKey(pageKey, field);
    }

    function getStoryboardFieldValue(pageKey, field) {
      const page = state.pages[pageKey] || {};
      return String(page[field] || '');

    function getStoryboardAutoValue(pageKey, field) {
      const page = state.pages[pageKey] || {};

      return `

      const grades = ['3학년', '4학년', '5학년'];
      const selectedGradeStudents = rosterState.students.filter((student) => student.grade === submission.grade);
      const urlValid = isBookUrlValid(submission.bookUrl);
      const canSubmit = canSubmitBook();
      const submitButtonClasses = canSubmit
        ? 'bg-brand-500 hover:bg-brand-600 text-white shadow-md'
        : 'bg-slate-200 text-slate-400 cursor-not-allowed';
      const checkClasses = submission.linkChecked
        ? 'border-brand-500 bg-brand-50 text-slate-900'
        : 'border-slate-200 bg-white text-slate-700 hover:border-brand-300';
      const statusHtml = bookSubmitStatus.error
        ? `<div class="mt-4 bg-rose-50 border border-rose-200 text-rose-700 rounded-2xl p-4 font-bold break-keep" aria-live="polite">${escapeHtml(bookSubmitStatus.error)}</div>`
        : bookSubmitStatus.message
          ? `<div class="mt-4 bg-green-50 border border-green-200 text-green-700 rounded-2xl p-4 font-bold break-keep" aria-live="polite">${escapeHtml(bookSubmitStatus.message)}</div>`
          : '';

      return `
        <section class="mb-8 bg-slate-50 border border-slate-200 rounded-3xl p-6 sm:p-8">
          ${sectionTitle('📚 완성한 내 책을 선생님께 보내요', 'Book Creator에서 만든 책 링크를 확인한 뒤 제출해요.')}

          <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-7">
            ${['Book Creator에서 책 완성하기', '공유 링크 복사하기', '학년·이름·링크 확인 후 제출하기'].map((item, index) => `
              <div class="bg-white border border-slate-200 rounded-2xl p-4">
                <p class="text-sm font-extrabold text-brand-600 mb-1">STEP ${index + 1}</p>
                <p class="text-slate-800 font-extrabold break-keep">${item}</p>
              </div>
            `).join('')}
          </div>

          <div class="space-y-7">
            <div>
              ${sectionTitle('1. 학년을 골라요', '학년을 고르면 이름 목록이 나타나요.')}
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                ${grades.map((grade) => cardButton(grade, `setSubmissionGrade('${grade}')`, submission.grade === grade, 'min-h-[62px]')).join('')}
              </div>
            </div>

            <div>
              ${sectionTitle('2. 내 이름을 골라요', '학생 명단에서 내 이름을 찾아 눌러요.')}
              ${renderSubmissionRoster(selectedGradeStudents)}
            </div>

            <div>
              ${sectionTitle('3. Book Creator 읽기 링크를 붙여 넣어요', '공유한 책의 읽기 링크를 붙여 넣고, 내 책이 맞는지 먼저 열어 확인해요.')}
              <input type="url" value="${escapeHtml(submission.bookUrl)}" oninput="updateBookSubmissionUrl(this.value)" placeholder="https://read.bookcreator.com/..." class="focus-ring w-full min-h-[56px] rounded-2xl border-2 border-slate-200 px-4 text-lg font-bold bg-white">
              ${submission.bookUrl && !urlValid ? '<p class="mt-2 text-sm font-extrabold text-rose-600 break-keep">Book Creator 읽기 링크는 https://read.bookcreator.com 주소여야 해요.</p>' : ''}
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
                <button type="button" onclick="openSubmittedBook()" class="focus-ring min-h-[56px] bg-white border border-brand-200 text-brand-600 hover:bg-brand-50 font-extrabold rounded-2xl px-4 py-3 transition-colors">🔎 내 책 열어 확인하기</button>
                <button type="button" onclick="setSubmissionLinkChecked(${submission.linkChecked ? 'false' : 'true'})" aria-pressed="${submission.linkChecked ? 'true' : 'false'}" class="focus-ring min-h-[56px] text-left border-2 rounded-2xl px-4 py-3 font-extrabold transition-all ${checkClasses}">
                  <span class="inline-flex w-7 h-7 rounded-full border-2 items-center justify-center mr-2 align-middle ${submission.linkChecked ? 'border-brand-500 bg-brand-500 text-white' : 'border-slate-300 text-transparent'}" aria-hidden="true">✓</span>
                  내 책 링크가 맞아요
                </button>
              </div>
            </div>

            <div>
              ${sectionTitle('4. 선생님께 제출해요', '제출 후에도 같은 이름으로 다시 제출하면 새 링크로 수정돼요.')}
              <button type="button" onclick="submitBookLink()" ${canSubmit ? '' : 'disabled'} class="focus-ring min-h-[60px] w-full text-xl font-extrabold rounded-2xl px-6 py-4 transition-colors ${submitButtonClasses}">
                ${bookSubmitStatus.sending ? '제출하는 중...' : '📚 선생님께 내 책 보내기'}
              </button>
              ${submission.submitted ? `<p class="mt-3 text-sm font-extrabold text-green-700 break-keep">수정했어요 · ${escapeHtml(formatSubmittedAt(submission.submittedAt))}</p>` : ''}
              ${statusHtml}
            </div>
          </div>
        </section>
      `;
    }

    function renderSubmissionRoster(selectedGradeStudents) {
      if (rosterState.loading) {
        return '<div class="bg-white border border-slate-200 rounded-2xl p-5 text-slate-500 font-bold">학생 명단을 불러오는 중이에요.</div>';
      }

      if (rosterState.error) {
        return `
          <div class="bg-rose-50 border border-rose-200 rounded-2xl p-5">
            <p class="text-rose-700 font-extrabold break-keep">학생 명단을 불러오지 못했어요. 잠시 후 다시 눌러 주세요.</p>
            <button type="button" onclick="loadRoster(true)" class="focus-ring mt-4 min-h-[48px] bg-white border border-rose-200 text-rose-700 hover:bg-rose-50 font-extrabold rounded-2xl px-4 py-3 transition-colors">명단 다시 불러오기</button>
          </div>
        `;
      }

      if (!rosterState.loaded) {
        return '<div class="bg-white border border-slate-200 rounded-2xl p-5 text-slate-500 font-bold">잠시만 기다리면 명단이 나타나요.</div>';
      }

      if (!state.bookSubmission.grade) {
        return '<div class="bg-white border border-slate-200 rounded-2xl p-5 text-slate-500 font-bold">먼저 학년을 골라 주세요.</div>';
      }

      if (!selectedGradeStudents.length) {
        return '<div class="bg-white border border-slate-200 rounded-2xl p-5 text-slate-500 font-bold">이 학년의 명단을 찾지 못했어요. 선생님께 알려 주세요.</div>';
      }

      return `
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
          ${selectedGradeStudents.map((student) => cardButton(student.name, `setSubmissionName('${escapeJs(student.name)}')`, state.bookSubmission.name === student.name, 'min-h-[58px] p-3')).join('')}
        </div>
      `;
    }

    function scheduleRosterLoad() {
      if (rosterLoadScheduled || rosterState.loaded || rosterState.loading || rosterState.error) return;
      rosterLoadScheduled = true;
      setTimeout(() => {
        rosterLoadScheduled = false;
        loadRoster(false);
      }, 0);
    }

    async function loadRoster(force = false) {
      if (rosterState.loading) return;
      if (rosterState.loaded && !force) return;

      rosterState = { ...rosterState, loading: true, error: force ? '' : rosterState.error };
      render();

      try {
        const response = await fetch(`${BOOK_SUBMIT_API_URL}?action=roster`, { cache: 'no-store' });
        const data = await response.json();
        if (!data.ok || !Array.isArray(data.students)) {
          throw new Error(data.message || 'roster failed');
        }

        rosterState = {
          students: data.students
            .map((student) => ({
              grade: String(student.grade || '').trim(),
              name: String(student.name || '').trim()
            }))
            .filter((student) => student.grade && student.name),
          loaded: true,
          loading: false,
          error: ''
        };
      } catch (error) {
        rosterState = {
          students: [],
          loaded: false,
          loading: false,
          error: '학생 명단을 불러오지 못했어요. 잠시 후 다시 눌러 주세요.'
        };
      }

      render();
    }

    function resetSubmissionResult() {
      state.bookSubmission.submitted = false;
      state.bookSubmission.submittedAt = '';
      bookSubmitStatus = { sending: false, message: '', error: '' };
    }

    function setSubmissionGrade(grade) {
      if (state.bookSubmission.grade !== grade) {
        state.bookSubmission.grade = grade;
        state.bookSubmission.name = '';
        resetSubmissionResult();
      }
      saveState();
      render();
    }

    function setSubmissionName(name) {
      if (state.bookSubmission.name !== name) {
        state.bookSubmission.name = name;
        resetSubmissionResult();
      }
      saveState();
      render();
    }

    function updateBookSubmissionUrl(value) {
      const nextUrl = String(value || '').trim();
      if (state.bookSubmission.bookUrl === nextUrl) return;
      const shouldRender = state.bookSubmission.linkChecked || state.bookSubmission.submitted || bookSubmitStatus.message || bookSubmitStatus.error;
      state.bookSubmission.bookUrl = nextUrl;
      state.bookSubmission.linkChecked = false;
      resetSubmissionResult();
      saveState();
      if (shouldRender) render();
    }

    function isBookUrlValid(value) {
      const rawUrl = String(value || '').trim();
      if (!rawUrl) return false;
      try {
        const parsed = new URL(rawUrl);
        const hostname = parsed.hostname.toLowerCase().replace(/\.$/, '');
        return parsed.protocol === 'https:' && BOOK_ALLOWED_HOSTS.includes(hostname);
      } catch (error) {
        return false;
      }
    }

    function openSubmittedBook() {
      if (!isBookUrlValid(state.bookSubmission.bookUrl)) {
        alert('Book Creator 읽기 링크를 다시 확인해 주세요. https://read.bookcreator.com 주소여야 해요.');
        return;
      }

      const opened = window.open(state.bookSubmission.bookUrl, '_blank', 'noopener,noreferrer');
      bookSubmitStatus = {
        sending: false,
        message: opened ? '새 탭에서 내 책을 확인한 뒤 체크해 주세요.' : '팝업이 막혔다면 링크를 복사해 새 탭에서 열어 주세요.',
        error: ''
      };
      render();
    }

    function setSubmissionLinkChecked(value) {
      if (value && !isBookUrlValid(state.bookSubmission.bookUrl)) {
        alert('먼저 Book Creator 읽기 링크를 확인해 주세요.');
        return;
      }
      state.bookSubmission.linkChecked = Boolean(value);
      resetSubmissionResult();
      saveState();
      render();
    }

    function canSubmitBook() {
      const submission = state.bookSubmission;
      const selectedInRoster = rosterState.loaded && rosterState.students.some((student) => (
        student.grade === submission.grade && student.name === submission.name
      ));
      return Boolean(
        selectedInRoster &&
        submission.bookUrl &&
        isBookUrlValid(submission.bookUrl) &&
        submission.linkChecked &&
        !bookSubmitStatus.sending
      );
    }

    async function submitBookLink() {
      if (!canSubmitBook()) {
        alert('학년, 이름, 책 링크, 확인 체크를 모두 마쳐 주세요.');
        return;
      }

      bookSubmitStatus = { sending: true, message: '', error: '' };
      render();

      try {
        const body = new URLSearchParams();
        body.set('action', 'submitBook');
        body.set('grade', state.bookSubmission.grade);
        body.set('name', state.bookSubmission.name);
        body.set('bookUrl', state.bookSubmission.bookUrl);

        const response = await fetch(BOOK_SUBMIT_API_URL, {
          method: 'POST',
          body
        });
        const data = await response.json();

        if (!data.ok) {
          throw new Error(data.message || '제출에 실패했어요. 잠시 후 다시 시도해 주세요.');
        }

        state.bookSubmission.submitted = true;
        state.bookSubmission.submittedAt = new Date().toISOString();
        bookSubmitStatus = {
          sending: false,
          message: data.message || '책 링크를 저장했습니다.',
          error: ''
        };
        saveState();
      } catch (error) {
        state.bookSubmission.submitted = false;
        state.bookSubmission.submittedAt = '';
        bookSubmitStatus = {
          sending: false,
          message: '',
          error: error.message || '제출에 실패했어요. 잠시 후 다시 시도해 주세요.'
        };
        saveState();
      }

      render();
    }

    function formatSubmittedAt(value) {
      if (!value) return '방금 제출됨';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '제출 완료';
      return date.toLocaleString('ko-KR', {
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function renderPeerReview(peerConcern) {
      const peerItems = [
        { key: 'title', question: '제목을 보고 어떤 이야기인지 궁금한가요?' },
        { key: 'match', question: '그림과 이야기가 잘 어울리나요?' },
        { key: 'dream', question: '주인공이 어떤 꿈을 가진 사람인지 알 수 있나요?' }
      ];
      return `
        <section class="mb-8 bg-slate-50 border border-slate-200 rounded-3xl p-6 sm:p-8">
          ${sectionTitle('친구 검수', '친구가 없다면 자기 검수만으로도 완료할 수 있어요.')}
          <div class="grid grid-cols-1 gap-4">
            ${peerItems.map((item) => `
              <div class="bg-white border border-slate-200 rounded-2xl p-5">
                <p class="text-lg font-extrabold text-slate-900 mb-3 break-keep">${item.question}</p>
                <div class="grid grid-cols-2 gap-3">
                  ${cardButton('좋아요', `setPeer('${item.key}', 'good')`, state.peerReview[item.key] === 'good', 'min-h-[58px]')}
                  ${cardButton('궁금해요', `setPeer('${item.key}', 'think')`, state.peerReview[item.key] === 'think', 'min-h-[58px]')}
                </div>
              </div>
            `).join('')}
          </div>
          ${peerConcern ? reviewFocusBox('다시 읽어보기', '친구가 궁금해한 곳을 한 번 더 살펴보세요.', { note: '바로 고치지 않아도 괜찮아요. 친구가 궁금해한 부분을 읽고 확인해요.', extra: 'review-focus-compact mt-5' }) : ''}
        </section>
      `;
    }

    function renderChallenges() {
      const titleOptions = [
        makeBookTitle(),
        `${state.finalDream || '꿈'}의 하루`,
        `내 꿈이 반짝인 날`,
        `미래의 내가 해낸 일`
      ];
      return `
        <section class="mt-8 bg-white border-2 border-slate-100 rounded-3xl p-6 sm:p-8">
          <h3 class="text-2xl font-extrabold text-slate-900 mb-2">빠른 학생용 확장 활동</h3>
          <p class="text-slate-500 font-semibold mb-6">기본 9단계를 끝낸 학생만 도전해요.</p>

          <div class="space-y-7">
            <div>
              ${sectionTitle('도전 1 · 더 좋은 제목', '제목 후보를 보고 하나를 골라요.')}
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${titleOptions.map((title) => cardButton(title, `setChallenge('betterTitle', '${escapeJs(title)}')`, state.challenges.betterTitle === title)).join('')}
              </div>
            </div>

            <div>
              ${sectionTitle('도전 2 · 7쪽 추가', '「꿈을 이루기 전의 나」 한 장을 더 넣어 봐요.')}
              ${cardButton('현재 내가 꿈을 위해 해 보고 싶은 일을 한 장 추가했어요.', "toggleChallenge('page7')", state.challenges.page7)}
            </div>

            <div>
              ${sectionTitle('도전 3 · AI 그림 한 장 더', '이야기에서 가장 중요한 장면을 세 번째 그림으로 만들고 평가해요.')}
              <div class="mb-4">${cardButton('세 번째 그림 만들기를 시작했어요.', "toggleChallenge('image3Started')", state.challenges.image3Started)}</div>
              ${state.challenges.image3Started ? renderImagePanel('image3', '그림 3 · 가장 중요한 장면', makePrompt(3)) : ''}
            </div>

            <div>
              ${sectionTitle('도전 4 · 친구 책 편집자', '친구 작품에서 전하고 싶은 피드백을 골라요.')}
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${cardButton('가장 기억에 남는 장면을 알려줬어요.', "setChallenge('editorMemory', 'memory')", state.challenges.editorMemory === 'memory')}
                ${cardButton('더 알고 싶은 부분을 알려줬어요.', "setChallenge('editorQuestion', 'question')", state.challenges.editorQuestion === 'question')}
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function makeFutureSentence(snapshot = state) {
      const finalDream = snapshot.finalDream || '선택한 꿈';
      const place = snapshot.future.place || '선택한 장소';
      const action = snapshot.future.action || '선택한 일';
      const companion = snapshot.future.companion || '선택한 대상';
      const mood = snapshot.future.mood || '선택한 분위기';
      const companionText = companion === '혼자' ? '혼자' : `${companion}와 함께`;
      return `나는 미래에 ${finalDream}가 되었어요. ${place}에서 ${companionText} ${action}. ${place}은 ${mood} 분위기예요.`;
    }

    function makeStory(snapshot = state) {
      const futureText = makeFutureSentence(snapshot);
      const challenge = snapshot.story.challenge || '어떤 일이 생겼어요.';
      const action = snapshot.story.action || '나는 방법을 찾았어요.';
      const result = snapshot.story.result || '좋은 결과가 생겼어요.';
      return `${futureText} 그런데 어느 날 ${challenge} 나는 ${action} 결국 ${result}`;
    }

    function todayString() {
      const now = new Date();
      return `${now.getFullYear()}. ${now.getMonth() + 1}. ${now.getDate()}.`;
    }

    function syncStoryboardData() {
      if (!state.cover.createdDate) state.cover.createdDate = todayString();
      if (!state.cover.aiCredit) state.cover.aiCredit = '이미지 생성 도움: AI';

      const titleOptions = makeCoverTitleOptions();
      if (!state.cover.titleOption || !titleOptions.includes(state.cover.titleOption)) {
        state.cover.titleOption = titleOptions[0];
      }
      state.cover.finalTitle = resolveCoverTitle();

      storyboardPages.forEach((pageDef) => {
        const page = state.pages[pageDef.key];
        page.autoText = makePageText(pageDef.key);
        if (!page.textEdited || !page.text) {
          page.text = page.autoText;
          page.textEdited = false;
        }

        if (pageDef.imageAllowed) {
          page.autoImageBrief = makeImageBrief(pageDef.key);
          if (!page.imageBriefEdited || !page.imageBrief) {
            page.imageBrief = page.autoImageBrief;
            page.imageBriefEdited = false;
          }
          page.prompt = page.useImage ? makePrompt(pageDef.key) : '';
        }
      });

      state.selectedImagePages = getSelectedImagePages();
      state.bookPreviewPage = Math.min(Math.max(Number(state.bookPreviewPage) || 1, 1), 6);
    }

    function makeCoverTitleOptions() {
      const dream = state.finalDream || '꿈';
      return [
        `미래의 ${dream}`,
        '꿈을 이루는 나',
        `${dream}와 함께한 멋진 하루`
      ];
    }

    function resolveCoverTitle() {
      const customTitle = String(state.cover.customTitle || '').trim();
      return customTitle || state.cover.titleOption || makeCoverTitleOptions()[0];
    }

    function makeCoverInfoText() {
      return [
        `제목: ${resolveCoverTitle()}`,
        `글·구성: ${state.cover.authorName || '김○○'}`,
        `제작일: ${state.cover.createdDate || todayString()}`,
        state.cover.aiCredit || '이미지 생성 도움: AI'
      ].join('\n');
    }

    function makePage6InfoText() {
      return [
        state.pages.page6.cheerMessage || '미래의 나에게 보내는 응원 문장을 골라요.',
        '',
        `글·이야기 구성: ${state.cover.authorName || '김○○'}`,
        state.cover.aiCredit || '이미지 생성 도움: AI',
        `제작일: ${state.cover.createdDate || todayString()}`
      ].join('\n');
    }

    function makePageText(pageKey) {
      const finalDream = state.finalDream || '미래의 꿈';
      const place = state.future.place || '미래 공간';
      const action = state.future.action || '꿈을 이루는 모습';
      const companion = state.future.companion || '친구';
      const challenge = state.story.challenge || '어려운 일이 생겼어요.';
      const storyAction = state.story.action || '새로운 방법을 찾았어요.';
      const result = state.story.result || '문제를 해결했어요.';
      const companionText = companion === '혼자' ? '혼자' : `${companion}와 함께`;

      if (pageKey === 'page2') {
        return `나는 미래에 ${finalDream}가 되었어요.\n${place}에서 ${companionText} ${action}.`;
      }
      if (pageKey === 'page3') {
        return `그런데 어느 날 ${challenge}\n모두가 어떻게 해야 할지 고민했어요.`;
      }
      if (pageKey === 'page4') {
        return `나는 ${storyAction}\n여러 번 생각하고 시도하며 포기하지 않았어요.`;
      }
      if (pageKey === 'page5') {
        return `결국 ${result}\n나는 어려운 일을 해결하며 꿈을 이루는 사람으로 자랐어요.`;
      }
      if (pageKey === 'page6') {
        return makePage6InfoText();
      }
      return makeStory();
    }

    function makeImageBrief(pageKey) {
      const finalDream = state.finalDream || '미래의 꿈';
      const place = state.future.place || '미래 공간';
      const action = state.future.action || '꿈을 이루는 모습';
      const companion = state.future.companion || '친구';
      const mood = state.future.mood || '따뜻한';
      const challenge = state.story.challenge || '어려운 일이 생긴 장면';
      const storyAction = state.story.action || '새로운 방법을 찾는 모습';
      const result = state.story.result || '문제를 해결한 장면';
      const companionText = companion === '혼자' ? '혼자' : `${companion}와 함께`;

      if (pageKey === 'page2') {
        return `미래의 ${finalDream}가 ${mood} ${place}에서 ${companionText} ${action} 모습`;
      }
      if (pageKey === 'page3') {
        return `${place}에서 ${challenge} 주인공과 주변 사람들이 잠시 고민하는 모습`;
      }
      if (pageKey === 'page4') {
        return `${finalDream}가 된 주인공이 ${place}에서 ${storyAction} 모습`;
      }
      if (pageKey === 'page5') {
        return `${result} 뒤에 ${finalDream}가 된 주인공이 밝게 웃는 ${mood} 모습`;
      }
      return `${resolveCoverTitle()}에서 가장 중요한 장면`;
    }

    function makePrompt(pageKey) {
      if (pageKey === 3 || pageKey === 'image3') {
        return `초등학생 그림책 삽화. 「${makeBookTitle()}」에서 가장 중요한 장면, ${makeImageBrief(getSelectedImagePages()[0] || 'page2')}. 꿈과 행동이 분명하게 보이도록 표현, 글자 없음, 밝고 따뜻한 색감.`;
      }
      const page = state.pages[pageKey];
      const brief = page && page.imageBrief ? page.imageBrief : makeImageBrief(pageKey);
      return `${brief}. 어린이를 위한 밝고 따뜻한 디지털 그림책 일러스트, 등장인물과 행동이 분명하게 보이도록 표현, 글자 없음, 안전하고 희망적인 장면.`;
    }

    function makeBookTitle() {
      return `「${resolveCoverTitle()}」`;
    }

    function getSelectedImagePages() {
      return storyboardPages
        .filter((pageDef) => pageDef.imageAllowed && state.pages[pageDef.key].useImage)
        .map((pageDef) => pageDef.key);
    }

    function getImageIndex(pageKey) {
      const index = getSelectedImagePages().indexOf(pageKey);
      return index >= 0 ? index + 1 : '';
    }

    function getImageCheck(imageKey) {
      if (state.pages[imageKey] && state.pages[imageKey].imageCheck) {
        return state.pages[imageKey].imageCheck;
      }
      if (!state.imageChecks[imageKey]) {
        state.imageChecks[imageKey] = { dream: '', action: '', mood: '', decision: '' };
      }
      return state.imageChecks[imageKey];
    }

    function getBookPlanPages() {
      const selectedPages = getSelectedImagePages();
      const coverImageLabel = selectedPages.length
        ? '그림 있음 · 대표 이미지는 AI 그림 1 또는 2 중 어울리는 장면을 골라 넣어요.'
        : '그림 있음 · 대표 이미지를 넣을 예정이에요.';
      const pages = [
        {
          number: 1,
          key: 'cover',
          title: '표지',
          text: makeCoverInfoText(),
          useImage: true,
          imageLabel: coverImageLabel,
          copyLabel: '표지 정보 복사'
        }
      ];

      storyboardPages.forEach((pageDef) => {
        const page = state.pages[pageDef.key];
        const imageIndex = getImageIndex(pageDef.key);
        pages.push({
          number: pageDef.number,
          key: pageDef.key,
          title: pageDef.title,
          text: page.text,
          useImage: Boolean(page.useImage),
          imageLabel: page.useImage ? `그림 있음 · 사용할 그림: AI 그림 ${imageIndex}` : '그림 없음 · 이야기만 넣어요.',
          copyLabel: pageDef.key === 'page6' ? '6쪽 정보 복사' : '이야기 복사'
        });
      });

      return pages;
    }

    function renderFinalPlanCard(page) {
      const blockId = `final-plan-${page.number}`;
      return `
        <article class="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
            <div>
              <p class="text-sm font-extrabold text-brand-600">${page.number}쪽</p>
              <h3 class="text-2xl font-extrabold text-slate-900">${escapeHtml(page.title)}</h3>
            </div>
            <span class="inline-flex self-start sm:self-auto rounded-full px-4 py-2 text-sm font-extrabold ${page.useImage ? 'bg-brand-500 text-white' : 'bg-slate-100 text-slate-500'}">${page.imageLabel}</span>
          </div>
          ${reviewFocusBox('북크리에이터로 옮길 내용', page.text, { id: blockId, note: '복사하기 전에 이 페이지에 들어갈 내용을 마지막으로 읽어보세요.', extra: 'review-focus-compact' })}
          <button type="button" onclick="copyBlock('${blockId}', '${escapeJs(page.copyLabel)}되었습니다!')" class="focus-ring mt-4 min-h-[56px] w-full bg-white border border-brand-200 text-brand-600 hover:bg-brand-50 font-extrabold rounded-2xl px-4 py-3 transition-colors">${page.copyLabel}</button>
        </article>
      `;
    }

    function captureFirstDraftIfNeeded() {
      if (state.currentStep >= 5 && !state.originalSnapshot && isStepComplete(4)) {
        state.originalSnapshot = {
          future: { ...state.future },
          story: { ...state.story },
          finalDream: state.finalDream
        };
        state.firstStory = makeStory(state.originalSnapshot);
      }
    }

    function getChangedItems() {
      if (!state.originalSnapshot) return [];
      const checks = [
        { key: 'future.place', label: '미래 장소' },
        { key: 'future.action', label: '미래 행동' },
        { key: 'story.challenge', label: '사건' },
        { key: 'story.action', label: '해결 행동' },
        { key: 'story.result', label: '결과' },
        { key: 'future.mood', label: '분위기' }
      ];
      return checks.map((item) => {
        const before = item.key.split('.').reduce((obj, part) => obj && obj[part], state.originalSnapshot);
        const after = getValue(item.key);
        return { ...item, before, after };
      }).filter((item) => item.before && item.after && item.before !== item.after);
    }

    function isStepComplete(stepNumber) {
      if (stepNumber === 1) return true;
      if (stepNumber === 2) return Boolean(state.dreamCandidates.length === 2 && state.dreamValue && state.finalDream && state.dreamReason);
      if (stepNumber === 3) return Object.values(state.future).every(Boolean) && state.futureFit === 'yes';
      if (stepNumber === 4) return Object.values(state.story).every(Boolean);
      if (stepNumber === 5) return reviewQuestions.every((item) => state.storyReview[item.key]) && getChangedItems().length > 0;
      if (stepNumber === 6) {
        const coverReady = Boolean(resolveCoverTitle() && String(state.cover.authorName || '').trim() && state.cover.createdDate && state.cover.aiCredit);
        const pageTextReady = ['page2', 'page3', 'page4', 'page5'].every((pageKey) => Boolean(state.pages[pageKey].text));
        const imageReady = getSelectedImagePages().length === 2;
        const cheerReady = Boolean(state.pages.page6.cheerMessage);
        return coverReady && pageTextReady && imageReady && cheerReady;
      }
      if (stepNumber === 7) {
        const selectedPages = getSelectedImagePages();
        return selectedPages.length === 2 && selectedPages.every((pageKey) => {
          const page = state.pages[pageKey];
          return Boolean(page.prompt) && imageCheckQuestions.every((item) => page.imageCheck[item.key]);
        });
      }
      if (stepNumber === 8) return Boolean(state.bookPreviewChecked);
      if (stepNumber === 9) return isSelfChecklistComplete();
      return false;
    }

    function isSelfChecklistComplete() {
      return selfChecks.every(([key]) => state.selfChecklist[key]);
    }

    function missingMessage(stepNumber) {
      const messages = {
        2: '꿈 후보 2개, 좋아하는 일, 최종 꿈, 이유를 모두 골라 주세요.',
        3: '미래 장면 4가지를 고르고 "아주 잘 어울려요"로 확인해 주세요.',
        4: '사건, 해결 행동, 결과를 모두 골라 주세요.',
        5: '이야기 탐정 검사 3개를 마치고, 처음 선택에서 최소 1개를 실제로 바꿔 주세요.',
        6: '표지 제목과 글쓴이, 그림 페이지 2개, 6쪽 응원 문장을 모두 정해 주세요.',
        7: '선택한 두 페이지의 AI 그림 평가 3개씩을 모두 골라 주세요.',
        8: '책 미리 읽기에서 "네, 이대로 만들래요"를 눌러 확인해 주세요.',
        9: '자기 검수 11개를 모두 체크해 주세요.'
      };
      return messages[stepNumber] || '남은 활동을 확인해 주세요.';
    }

    function updateNav() {
      btnPrev.classList.toggle('hidden', state.currentStep === 1);
      btnNext.classList.toggle('hidden', state.currentStep === steps.length);
      if (state.currentStep < steps.length) {
        const complete = isStepComplete(state.currentStep);
        btnNext.disabled = false;
        btnNext.className = complete
          ? 'focus-ring px-8 py-3 bg-brand-500 text-white font-bold rounded-2xl hover:bg-brand-600 transition-colors sm:ml-auto shadow-sm'
          : 'focus-ring px-8 py-3 bg-brand-50 text-brand-400 font-bold rounded-2xl hover:bg-brand-100 transition-colors sm:ml-auto';
        navHint.textContent = complete ? '좋아요. 다음 단계로 갈 수 있어요.' : missingMessage(state.currentStep);
      } else {
        navHint.textContent = isStepComplete(9) ? '마지막 완료 버튼을 눌러 마무리해요.' : missingMessage(9);
      }
    }

    function toggleDream(value) {
      const index = state.dreamCandidates.indexOf(value);
      if (index >= 0) {
        state.dreamCandidates.splice(index, 1);
        if (state.finalDream === value) state.finalDream = '';
      } else if (state.dreamCandidates.length < 2) {
        state.dreamCandidates.push(value);
      } else {
        alert('꿈 후보는 정확히 2개까지만 고를 수 있어요. 바꾸고 싶다면 선택한 카드를 다시 눌러 빼 주세요.');
        return;
      }
      render();
    }

    function pick(path, value) {
      setValue(path, value);
      if (path.startsWith('future.')) {
        state.futureFit = '';
      }
      render();
    }

    function setStoryReview(key, value) {
      state.storyReview[key] = value;
      render();
    }

    function setRevisionTarget(key) {
      state.revisionTarget = key;
      render();
    }

    function applyRevision(key, value) {
      setValue(key, value);
      render();
    }

    function ensureNoActiveStoryboardEdit() {
      if (!activeStoryboardEdit) return true;
      alert('수정 중인 문장이 있어요. 먼저 "수정 완료"를 누르거나 처음 문장으로 되돌려 주세요.');
      return false;
    }

    function startStoryboardEdit(pageKey, field) {
      const editKey = storyboardEditKey(pageKey, field);
      if (activeStoryboardEdit && activeStoryboardEdit !== editKey) {
        alert('한 번에 하나의 문장만 수정할 수 있어요. 지금 수정 중인 문장을 먼저 마쳐 주세요.');
        return;
      }
      syncStoryboardData();
      activeStoryboardEdit = editKey;
      storyboardEditDraft = getStoryboardFieldValue(pageKey, field);
      render();
      setTimeout(() => {
        const textarea = document.getElementById(`edit-${pageKey}-${field}`);
        if (textarea) {
          textarea.focus();
          textarea.setSelectionRange(textarea.value.length, textarea.value.length);
        }
      }, 50);
    }

    function finishStoryboardEdit(pageKey, field) {
      const page = state.pages[pageKey];
      if (!page) return;
      const textarea = document.getElementById(`edit-${pageKey}-${field}`);
      const value = String(textarea ? textarea.value : storyboardEditDraft).trim();
      if (!value) {
        alert('빈 문장으로 저장할 수 없어요. 처음 문장으로 되돌리거나 내용을 적어 주세요.');
        return;
      }

      const autoValue = getStoryboardAutoValue(pageKey, field);
      page[field] = value;
      if (field === 'imageBrief') {
        page.imageBriefEdited = value !== autoValue;
        if (page.useImage) page.imageCheck = { dream: '', action: '', mood: '', decision: '' };
      } else {
        page.textEdited = value !== autoValue;
      }
      state.bookPreviewChecked = false;
      activeStoryboardEdit = null;
      storyboardEditDraft = '';
      saveState();
      render();
    }

    function resetStoryboardEdit(pageKey, field) {
      const page = state.pages[pageKey];
      if (!page) return;
      const autoValue = getStoryboardAutoValue(pageKey, field);
      page[field] = autoValue;
      if (field === 'imageBrief') {
        page.imageBriefEdited = false;
        if (page.useImage) page.imageCheck = { dream: '', action: '', mood: '', decision: '' };
      } else {
        page.textEdited = false;
      }
      state.bookPreviewChecked = false;
      activeStoryboardEdit = null;
      storyboardEditDraft = '';
      saveState();
      render();
    }

    function setImageCheck(imageKey, key, value) {
      const check = getImageCheck(imageKey);
      check[key] = value;
      render();
    }

    function setCoverTitleOption(value) {
      if (!ensureNoActiveStoryboardEdit()) return;
      state.cover.titleOption = value;
      state.cover.customTitle = '';
      state.bookPreviewChecked = false;
      render();
    }

    function setCoverField(key, value) {
      if (!ensureNoActiveStoryboardEdit()) return;
      state.cover[key] = value;
      state.bookPreviewChecked = false;
      render();
    }

    function choosePageImage(pageKey, useImage) {
      if (!ensureNoActiveStoryboardEdit()) return;
      if (!state.pages[pageKey]) return;
      if (useImage && !state.pages[pageKey].useImage && getSelectedImagePages().length >= 2) {
        alert('AI 그림은 2장만 만들 수 있어요. 다른 그림 페이지를 먼저 이야기만으로 바꿔 주세요.');
        return;
      }
      state.pages[pageKey].useImage = useImage;
      state.pages[pageKey].imageCheck = { dream: '', action: '', mood: '', decision: '' };
      state.bookPreviewChecked = false;
      render();
    }

    function setCheerMessage(value) {
      if (!ensureNoActiveStoryboardEdit()) return;
      state.pages.page6.cheerMessage = value;
      state.bookPreviewChecked = false;
      render();
    }

    function movePreview(delta) {
      state.bookPreviewPage = Math.min(Math.max((Number(state.bookPreviewPage) || 1) + delta, 1), 6);
      render();
    }

    function setBookPreviewChecked(value) {
      state.bookPreviewChecked = Boolean(value);
      render();
    }

    function returnToStoryboard() {
      state.bookPreviewChecked = false;
      state.currentStep = 6;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleGroup(group, key) {
      state[group][key] = !state[group][key];
      render();
    }

    function showBookLinks() {
      state.creatorOpened = true;
      render();
      setTimeout(() => {
        const links = document.getElementById('book-links');
        if (links) links.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 50);
    }

    function markCreatorOpened() {
      state.creatorOpened = true;
      saveState();
    }

    function setPeer(key, value) {
      state.peerReview[key] = value;
      render();
    }

    function completeProject() {
      if (!isSelfChecklistComplete()) {
        alert(missingMessage(9));
        return;
      }
      state.completed = true;
      render();
    }

    function setChallenge(key, value) {
      state.challenges[key] = value;
      render();
    }

    function toggleChallenge(key) {
      state.challenges[key] = !state.challenges[key];
      render();
    }

    function goNext() {
      if (!ensureNoActiveStoryboardEdit()) return;
      if (!isStepComplete(state.currentStep)) {
        alert(missingMessage(state.currentStep));
        return;
      }
      if (state.currentStep < steps.length) {
        state.currentStep += 1;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        mainContent.focus({ preventScroll: true });
      }
    }

    function goPrev() {
      if (!ensureNoActiveStoryboardEdit()) return;
      if (state.currentStep > 1) {
        state.currentStep -= 1;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        mainContent.focus({ preventScroll: true });
      }
    }

    function jumpToStep(stepNumber) {
      if (!ensureNoActiveStoryboardEdit()) return;
      if (stepNumber <= state.currentStep) {
        state.currentStep = stepNumber;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      for (let index = 1; index < stepNumber; index += 1) {
        if (!isStepComplete(index)) {
          alert(`${index}단계: ${missingMessage(index)}`);
          return;
        }
      }
      state.currentStep = stepNumber;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetAll() {
      if (confirm('처음부터 다시 작성하시겠어요? 선택한 내용이 모두 지워집니다.')) {
        state = defaultState();
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (error) {}
        render();
      }
    }

    function copyPrompt(elementId) {
      copyBlock(elementId, '프롬프트가 복사되었습니다!');
    }

    function copyBlock(elementId, successMessage = '복사되었습니다!') {
      const source = document.getElementById(elementId);
      if (!source) return;
      const text = source.innerText.trim();
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          alert(successMessage);
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text, successMessage);
      }
    }

    function fallbackCopy(text, successMessage = '복사되었습니다!') {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        alert(successMessage);
      } catch (error) {
        alert('복사에 실패했어요. 내용을 직접 드래그해서 복사해 주세요.');
      }
      document.body.removeChild(textarea);
    }

    btnPrev.addEventListener('click', goPrev);
    btnNext.addEventListener('click', goNext);
    btnReset.addEventListener('click', resetAll);

    render();
  </script>
</body>
</html>
