    <script>
        // DOM Elements
        const mainContent = document.getElementById('main-content');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const stepCircles = document.getElementById('step-circles');
        const headerSubtitle = document.getElementById('header-subtitle');

        // Initialize
        function init() {
            renderStepCircles();
            renderStep();
        }

        // Render Step Circles
        function renderStepCircles() {
            let html = '';
            for(let i=1; i<=totalSteps; i++) {
                if(i === currentStep) {
                    html += `<div class="w-8 h-8 rounded-full bg-brand-100 text-brand-600 border border-brand-200 flex items-center justify-center font-bold text-sm transition-all">${i}</div>`;
                } else if (i < currentStep) {
                    html += `<div class="w-8 h-8 rounded-full bg-brand-500 text-white flex items-center justify-center font-bold text-sm transition-all">${i}</div>`;
                } else {
                    html += `<div class="w-8 h-8 rounded-full bg-white text-slate-400 border border-slate-200 flex items-center justify-center font-bold text-sm transition-all">${i}</div>`;
                }
            }
            stepCircles.innerHTML = html;
        }

        // Save Selection
        function selectOption(key, value) {
            userSelections[key] = value;
            renderStep(); // Re-render to show selected state
        }

        // Prompt Tip Mini-Quiz Feedback
        function checkPromptTip(isGood) {
            const feedback = document.getElementById('tip-feedback');
            feedback.classList.remove('hidden');
            if (isGood) {
                feedback.className = 'mt-5 p-4 rounded-xl font-semibold bg-green-50 text-green-700';
                feedback.innerHTML = '🎉 맞아요! 색깔, 재료, 표정, 동작, 그림체를 자세히 적을수록 AI가 상상한 그림에 더 가깝게 그려줘요.';
            } else {
                feedback.className = 'mt-5 p-4 rounded-xl font-semibold bg-amber-50 text-amber-700';
                feedback.innerHTML = '음, 이 부탁은 너무 간단해서 AI가 마음대로 그릴 수도 있어요. 오른쪽처럼 자세하게 적어보면 어떨까요?';
            }
        }

        // Toggle AI Ethics Checklist
        function toggleEthics(idx) {
            userSelections.ethics[idx] = !userSelections.ethics[idx];
            renderStep();
        }

        // Handle custom input
        function handleCustomInput(key, event) {
            userSelections[key] = event.target.value;
            // Also select the radio button visually
            const radios = document.getElementsByName(key);
            radios.forEach(r => r.checked = false);
            document.getElementById(`custom_${key}`).checked = true;
        }

        function checkCustomRadio(key) {
             const input = document.getElementById(`custom_input_${key}`);
             userSelections[key] = input.value;
             renderStep();
        }

        function renderStep() {
            const step = stepsData[currentStep - 1];
            let contentHTML = '';

            // Update Header & Progress
            progressText.innerText = `${currentStep} / ${totalSteps}`;
            progressBar.style.width = `${(currentStep / totalSteps) * 100}%`;
            headerSubtitle.innerText = step.title || "4컷 만화 만들기";
            renderStepCircles();

            // Trigger Animation
            mainContent.classList.remove('step-transition');
            void mainContent.offsetWidth; // trigger reflow
            mainContent.classList.add('step-transition');

            // Intro Step
            if (step.type === 'intro') {
                contentHTML = `
                    <div class="text-center max-w-2xl mx-auto py-8">
                        <div class="inline-flex items-center justify-center px-4 py-2 mb-6 rounded-full bg-brand-50 border border-brand-200 text-brand-600 font-extrabold text-sm tracking-wide shadow-sm">
                            🎨 오늘은 내가 AI 웹툰 작가!
                        </div>

                        <div class="w-20 h-20 bg-brand-100 text-brand-600 rounded-3xl mx-auto flex items-center justify-center text-4xl mb-6 shadow-sm">
                            🎬
                        </div>

                        <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-900 mb-8">${step.subtitle}</h2>

                        <div class="bg-white border-2 border-slate-100 rounded-3xl p-6 sm:p-8 mb-8 text-left shadow-sm">
                            <h3 class="text-xl font-bold text-brand-600 mb-3 flex items-center gap-2">
                                💡 왜 4컷 만화로 만들까요?
                            </h3>
                            <p class="text-lg text-slate-700 leading-relaxed mb-5">
                                진짜 용기와 따뜻한 마음은 말보다 <strong class="bg-brand-50 text-brand-600 px-1 rounded">하나의 멋진 행동</strong>으로 더 잘 전해져요.<br>
                                권투 장갑이 위기에 처한 친구를 구하는 빛나는 순간! 그 순간의 표정과 힘찬 움직임을 컷마다 가장 생생하게 담아내기에는 웹툰(만화)이 최고랍니다.
                            </p>
                            <div class="w-full h-px bg-slate-100 mb-5"></div>
                            <p class="text-lg text-slate-600 leading-relaxed font-medium">
                                시간 여행 우산을 타고 온 미래의 뜨개방!<br>
                                그곳에서 어떤 다급한 위기가 벌어졌을까요? 지금부터 작가가 되어 카드를 고르고, 세상에 하나뿐인 나만의 이야기를 완성해 보세요.
                            </p>
                        </div>

                        <div class="bg-amber-50 border-2 border-amber-200 rounded-3xl p-6 sm:p-8 mb-8 text-left shadow-sm">
                            <h3 class="text-xl font-bold text-amber-700 mb-3 flex items-center gap-2">
                                🤔 어? 이야기 결말을 이미 아는데, 왜 다시 만들까요?
                            </h3>
                            <p class="text-lg text-slate-700 leading-relaxed">
                                책 속 그림은 그림 작가님 한 분이 상상해서 그린 장면이에요.<br>
                                그런데 같은 이야기를 읽어도 우리 머릿속에 떠오르는 모습은 조금씩 달라요!<br>
                                오늘 여러분은 이 장면을 그리는 또 다른 <strong class="bg-white text-amber-700 px-1 rounded">그림 작가</strong>가 되어, 내가 상상한 모습을 AI의 도움을 받아 직접 그림으로 꺼내 보는 거예요. 세상에 하나뿐인 나만의 그림이 완성돼요!
                            </p>
                        </div>
                    </div>
                `;
            }
            // Option Selection Steps (2~7)
            else if (!step.type) {
                const keyMap = {2: 'place', 3: 'situation', 4: 'emotion', 5: 'action', 6: 'resolution', 7: 'style'};
                const currentKey = keyMap[currentStep];
                const selectedValue = userSelections[currentKey];

                contentHTML = `
                    <div class="text-center mb-8">
                        <div class="inline-flex items-center justify-center gap-2 mb-3">
                            <div class="w-10 h-10 bg-brand-100 rounded-full flex items-center justify-center text-xl text-brand-600">${step.icon}</div>
                            <span class="text-brand-600 font-bold text-sm tracking-wide">${step.stepNum}</span>
                        </div>
                        <h2 class="text-3xl font-extrabold text-slate-900 mb-3">${step.question}</h2>
                        <p class="text-slate-500">${step.desc}</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-4xl mx-auto">
                `;

                step.options.forEach((opt, idx) => {
                    const isSelected = selectedValue === opt;
                    contentHTML += `
                        <label class="relative flex items-center p-5 cursor-pointer rounded-2xl border-2 transition-all duration-200 ${isSelected ? 'border-brand-500 bg-brand-50' : 'border-slate-200 hover:border-brand-300 bg-white'}">
                            <input type="radio" name="${currentKey}" value="${opt}" class="hidden" onchange="selectOption('${currentKey}', '${opt}')" ${isSelected ? 'checked' : ''}>
                            <div class="flex-1 pr-8">
                                <span class="block text-slate-800 font-semibold text-lg leading-snug">${opt}</span>
                            </div>
                            <div class="absolute right-5 w-6 h-6 rounded-full border-2 flex items-center justify-center ${isSelected ? 'border-brand-500 bg-brand-500' : 'border-slate-300'}">
                                ${isSelected ? '<svg class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : ''}
                            </div>
                        </label>
                    `;
                });

                // Direct Input Option
                const isCustomSelected = selectedValue !== "" && !step.options.includes(selectedValue);
                const customValue = isCustomSelected ? selectedValue : "";
                contentHTML += `
                        <label class="relative flex items-center p-5 cursor-pointer rounded-2xl border-2 transition-all duration-200 ${isCustomSelected ? 'border-brand-500 bg-brand-50' : 'border-slate-200 hover:border-brand-300 bg-white'}" onclick="checkCustomRadio('${currentKey}')">
                            <input type="radio" id="custom_${currentKey}" name="${currentKey}" class="hidden" ${isCustomSelected ? 'checked' : ''}>
                            <div class="flex-1 pr-8">
                                <span class="block text-sm text-brand-500 font-bold mb-1">직접 입력하기</span>
                                <input type="text" id="custom_input_${currentKey}" value="${customValue}" placeholder="여기에 직접 적어주세요." class="w-full bg-transparent border-b border-slate-300 focus:border-brand-500 focus:outline-none py-1 text-slate-800 font-semibold text-lg placeholder-slate-400" oninput="handleCustomInput('${currentKey}', event)">
                            </div>
                            <div class="absolute right-5 w-6 h-6 rounded-full border-2 flex items-center justify-center ${isCustomSelected ? 'border-brand-500 bg-brand-500' : 'border-slate-300'}">
                                ${isCustomSelected ? '<svg class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : ''}
                            </div>
                        </label>
                `;

                contentHTML += `
                    </div>
                    <div class="text-center mt-6 text-sm text-slate-400">한 가지 항목만 골라 주세요. 다시 누르면 선택을 바꿀 수 있어요.</div>
                `;
            }
            else if (step.type === 'tips') {
                const ethicsLabels = [
                    "유명한 연예인이나 친구, 선생님의 실제 이름은 넣지 않을게요.",
                    "실제 사람의 얼굴 사진처럼 진짜 같은 그림은 부탁하지 않을게요.",
                    "무섭거나 다치게 하는 장면은 부탁하지 않을게요."
                ];

                contentHTML = `
                    <div class="max-w-3xl mx-auto">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center gap-2 mb-3">
                                <div class="w-10 h-10 bg-brand-100 rounded-full flex items-center justify-center text-xl text-brand-600">🔑</div>
                                <span class="text-brand-600 font-bold text-sm tracking-wide">${step.stepNum}</span>
                            </div>
                            <h2 class="text-3xl font-extrabold text-slate-900 mb-3">${step.question}</h2>
                            <p class="text-slate-500">${step.desc}</p>
                        </div>

                        <!-- 프롬프트 꿀팁 미니 퀴즈 -->
                        <div class="bg-white border-2 border-slate-100 rounded-3xl p-6 sm:p-8 mb-6 shadow-sm">
                            <h3 class="text-xl font-bold text-brand-600 mb-4 flex items-center gap-2">
                                🔑 어떤 부탁이 더 멋진 그림을 만들어 줄까요?
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <button onclick="checkPromptTip(false)" id="tip-simple" class="text-left p-5 rounded-2xl border-2 border-slate-200 hover:border-brand-300 bg-white transition-all">
                                    <span class="block text-sm font-bold text-slate-400 mb-2">간단한 부탁</span>
                                    <span class="block text-slate-800 font-semibold text-lg leading-snug">"권투 장갑이 있어요"</span>
                                </button>
                                <button onclick="checkPromptTip(true)" id="tip-detail" class="text-left p-5 rounded-2xl border-2 border-slate-200 hover:border-brand-300 bg-white transition-all">
                                    <span class="block text-sm font-bold text-slate-400 mb-2">자세한 부탁</span>
                                    <span class="block text-slate-800 font-semibold text-lg leading-snug">"파란색의 푹신한 권투 장갑 캐릭터가 눈썹을 찌푸리며 힘차게 주먹을 뻗는 모습, 색연필로 그린 그림책 그림체"</span>
                                </button>
                            </div>
                            <div id="tip-feedback" class="mt-5 p-4 rounded-xl font-semibold hidden"></div>
                            <p class="text-sm text-slate-400 mt-4">💡 색깔, 재료, 표정, 동작, 그림체를 자세히 적을수록 AI가 상상한 그림에 더 가깝게 그려줘요.</p>
                        </div>

                        <!-- AI 윤리 약속 -->
                        <div class="bg-white border-2 border-slate-100 rounded-3xl p-6 sm:p-8 shadow-sm">
                            <h3 class="text-xl font-bold text-brand-600 mb-4 flex items-center gap-2">
                                🤝 AI와 함께 그림 그릴 때 약속해요
                            </h3>
                            <div class="space-y-3">
                                ${ethicsLabels.map((label, idx) => `
                                    <label class="flex items-center gap-3 p-4 rounded-xl border-2 cursor-pointer transition-all ${userSelections.ethics[idx] ? 'border-brand-500 bg-brand-50' : 'border-slate-200 bg-white hover:border-brand-300'}">
                                        <input type="checkbox" class="w-5 h-5 accent-brand-500" onchange="toggleEthics(${idx})" ${userSelections.ethics[idx] ? 'checked' : ''}>
                                        <span class="text-slate-700 font-semibold">${label}</span>
                                    </label>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }
            else if (step.type === 'prompt') {
                const prompt1 = `${userSelections.place} 배경, ${userSelections.situation}, ${userSelections.style}`;
                const prompt2 = `${CHARACTER_IDENTITY}. 이 캐릭터가 ${userSelections.emotion} 표정을 짓고 있어요, ${userSelections.style}`;
                const prompt3 = `${CHARACTER_IDENTITY}. 이 캐릭터가 ${userSelections.action} 모습이에요, 힘차게 움직이는 장면, ${userSelections.style}`;
                const prompt4 = `${CHARACTER_IDENTITY}. 이 캐릭터를 포함한 장갑 친구들이 ${userSelections.resolution} 결말을 맞이해요, ${userSelections.style}`;

                contentHTML = `
                    <div class="text-center mb-8">
                        <div class="inline-flex items-center justify-center gap-2 mb-3">
                            <div class="w-10 h-10 bg-brand-100 rounded-full flex items-center justify-center text-xl text-brand-600">✍️</div>
                            <span class="text-brand-600 font-bold text-sm tracking-wide">${step.stepNum}</span>
                        </div>
                        <h2 class="text-3xl font-extrabold text-slate-900 mb-3">${step.question}</h2>
                        <p class="text-slate-500">${step.desc}</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-4xl mx-auto">
                        ${renderPromptBox('1컷', prompt1, 'prompt1')}
                        ${renderPromptBox('2컷', prompt2, 'prompt2')}
                        ${renderPromptBox('3컷', prompt3, 'prompt3')}
                        ${renderPromptBox('4컷', prompt4, 'prompt4')}
                    </div>
                `;
            }
            else if (step.type === 'final') {
                contentHTML = `
                    <div class="max-w-4xl mx-auto">
                        <!-- Top Action Buttons -->
                        <div class="flex flex-col sm:flex-row justify-center gap-4 mb-10">
                            <a href="https://85656ad2.ai-chat-image-studio.pages.dev/image/" target="_blank" class="flex-1 sm:flex-none flex justify-center items-center gap-2 bg-brand-500 hover:bg-brand-600 text-white font-bold text-lg py-4 px-8 rounded-2xl shadow-md transition-colors">
                                이미지 생성 사이트 열기 ↗
                            </a>
                            <button id="btn-save-check" onclick="toggleSaveCheck()" class="flex-1 sm:flex-none flex justify-center items-center gap-2 bg-white border-2 border-slate-200 text-slate-500 hover:bg-slate-50 font-bold text-lg py-4 px-8 rounded-2xl shadow-sm transition-colors">
                                그림을 저장했어요
                            </button>
                        </div>

                        <!-- Book Creator Links Box -->
                        <div class="bg-white border border-slate-200 rounded-[2rem] p-6 sm:p-8 shadow-sm">
                            <div class="flex items-center gap-3 mb-2">
                                <div class="text-2xl">📚</div>
                                <h3 class="text-2xl font-bold text-slate-900">내 Book Creator 열기</h3>
                            </div>
                            <p class="text-slate-500 mb-6">내 이름을 찾아 누르면 내 책이 새 창으로 열려요.</p>

                            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                                ${students.map(student => `
                                    <a href="${student.url}" target="_blank" class="flex justify-between items-center bg-white border border-slate-200 hover:border-brand-300 hover:shadow-md text-brand-600 font-bold py-3 px-4 rounded-xl transition-all group">
                                        <span>${student.name}</span>
                                        <svg class="w-4 h-4 text-slate-400 group-hover:text-brand-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                    </a>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            mainContent.innerHTML = contentHTML;
            updateNavButtons();
        }

        // Prompt Box Component
        function renderPromptBox(title, content, id) {
            return `
                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 flex flex-col h-full">
                    <h3 class="font-bold text-brand-600 mb-2">${title}</h3>
                    <div class="bg-white border border-slate-200 rounded-xl p-3 text-slate-700 text-sm mb-4 flex-grow break-keep leading-relaxed" id="${id}">
                        ${content}
                    </div>
                    <button onclick="copyText('${id}')" class="w-full py-2.5 bg-white border border-brand-200 text-brand-600 font-bold rounded-xl hover:bg-brand-50 transition-colors flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        복사하기
                    </button>
                </div>
            `;
        }

        function updateNavButtons() {
            // Prev Button
            if (currentStep === 1) {
                btnPrev.classList.add('hidden');
            } else {
                btnPrev.classList.remove('hidden');
            }

            // Next Button Logic
            if (currentStep === totalSteps) {
                btnNext.classList.add('hidden');
            } else {
                btnNext.classList.remove('hidden');

                // Style Next button based on step completion (Mock validation)
                const step = stepsData[currentStep - 1];
                let isComplete = true;

                if (step.id === 2 && !userSelections.place) isComplete = false;
                if (step.id === 3 && !userSelections.situation) isComplete = false;
                if (step.id === 4 && !userSelections.emotion) isComplete = false;
                if (step.id === 5 && !userSelections.action) isComplete = false;
                if (step.id === 6 && !userSelections.resolution) isComplete = false;
                if (step.id === 7 && !userSelections.style) isComplete = false;
                if (step.id === 8 && !userSelections.ethics.every(v => v)) isComplete = false;

                if (isComplete) {
                    btnNext.className = "px-8 py-3 bg-brand-500 text-white font-bold rounded-2xl hover:bg-brand-600 transition-colors ml-auto shadow-sm";
                } else {
                    btnNext.className = "px-8 py-3 bg-brand-50 text-brand-400 font-bold rounded-2xl cursor-not-allowed ml-auto";
                }
            }
        }

        function goNext() {
            // Validation Check
            const step = stepsData[currentStep - 1];
            if (step.id === 2 && !userSelections.place) return alert("장소를 선택해 주세요.");
            if (step.id === 3 && !userSelections.situation) return alert("상황을 선택해 주세요.");
            if (step.id === 4 && !userSelections.emotion) return alert("마음을 선택해 주세요.");
            if (step.id === 5 && !userSelections.action) return alert("행동을 선택해 주세요.");
            if (step.id === 6 && !userSelections.resolution) return alert("결말을 선택해 주세요.");
            if (step.id === 7 && !userSelections.style) return alert("그림 스타일을 선택해 주세요.");
            if (step.id === 8 && !userSelections.ethics.every(v => v)) return alert("AI와 함께하는 약속 3가지를 모두 확인해 주세요.");

            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function goPrev() {
            if (currentStep > 1) {
                currentStep--;
                renderStep();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function resetAll() {
            if(confirm("처음부터 다시 작성하시겠어요? 선택한 내용이 모두 지워집니다.")) {
                currentStep = 1;
                userSelections.place = "";
                userSelections.situation = "";
                userSelections.emotion = "";
                userSelections.action = "";
                userSelections.resolution = "";
                userSelections.style = "";
                userSelections.ethics = [false, false, false];
                renderStep();
            }
        }

        // Copy to clipboard
        function copyText(elementId) {
            const textToCopy = document.getElementById(elementId).innerText;
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                alert('프롬프트가 복사되었습니다!');
            } catch (err) {
                alert('복사에 실패했습니다. 직접 드래그해서 복사해주세요.');
            }
            document.body.removeChild(textarea);
        }

        // Toggle Save Check Button (Final Step)
        let isSaved = false;
        function toggleSaveCheck() {
            const btn = document.getElementById('btn-save-check');
            isSaved = !isSaved;
            if(isSaved) {
                btn.className = "flex-1 sm:flex-none flex justify-center items-center gap-2 bg-[#1A8D5F] text-white font-bold text-lg py-4 px-8 rounded-2xl shadow-md transition-colors";
                btn.innerHTML = "✔ 그림을 저장했어요";
            } else {
                btn.className = "flex-1 sm:flex-none flex justify-center items-center gap-2 bg-white border-2 border-slate-200 text-slate-500 hover:bg-slate-50 font-bold text-lg py-4 px-8 rounded-2xl shadow-sm transition-colors";
                btn.innerHTML = "그림을 저장했어요";
            }
        }

        // Start
        window.onload = init;
    </script>
</body>
</html>
